# Backend for VRX (Gazebo Garden) med vår egen ASV fra pakken asv_gazebo.
# Grensene er ANSLAG og må settes til motorenes ekte verdier.
thruster_adapter:
  ros__parameters:
    thrusters: [left, right, bow]
    steerable: [left, right]
    thrust_topic: /asv/thrusters/{side}/thrust
    angle_topic: /asv/thrusters/{side}/pos
    max_thrust: 50.0     # newton per thruster. I modellen: baug ±25 N, akter bakover -30 N.
    max_angle: 1.5708    # radianer, ±90° (control, 2026-10-19)
    thrust_scale: 1.0
    angle_scale: 1.0
    timeout: 0.5
    thrust_time_constant: 0.0   # sekunder, treghet i motorene (0 = øyeblikkelig). ANSLAG for våre: ca. 0,2-0,5

stub_controller:
  ros__parameters:
    kp: 30.0               # newton per radian heading-feil
    # Fart, per motor: foroverkobling pluss PI-regulator på målt fart.
    thrust_per_mps: 8.0    # newton per m/s ønsket fart
    speed_kp: 20.0         # newton per m/s fartsfeil
    speed_ki: 10.0         # newton per m/s fartsfeil per sekund
    max_thrust: 50.0       # newton

sensor_relay:
  ros__parameters:
    inputs:
      - /asv/sensors/imu
      - /asv/sensors/gps
    outputs:
      - /autonomy/imu
      - /autonomy/gps/fix
    types:
      - sensor_msgs/msg/Imu
      - sensor_msgs/msg/NavSatFix
