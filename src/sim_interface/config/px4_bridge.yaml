# Koblingen mot control sin PX4 via uXRCE-DDS. Uavhengig av hvilken simulator som kjører.
px4_motor_bridge:
  ros__parameters:
    motor_output_topic: /fmu/out/motor_output
    # Sendt videre = (verdi - offset) * scale. Control sender thrust som -100..100 % (2026-10-19),
    # så scale = maks thrust / 100. Maks thrust er anslag for vår båt (50 N akter, 25 N baug).
    # Positiv baugthrust hos control skyver baugen mot styrbord, i kontrakten mot babord: derfor minus.
    # Med WAM-V (2353 N) må stern_thrust_scale settes til ca. 23,5.
    thrust_offset: 0.0
    stern_thrust_scale: 0.5
    forward_thrust_scale: -0.25
    # Vinklene er ikke avklart (enhet, fortegn, hvor langt de dreier). Dette sender dem rett videre.
    angle_offset: 0.0
    angle_scale: 1.0
    forward_thruster: ''   # tom = forward_propeller_thrust ignoreres (WAM-V har ingen)

px4_seapath_bridge:
  ros__parameters:
    seapath_topic: /fmu/in/seapath_data
    rate: 50.0   # Hz. Hvor ofte den ekte Seapath-en sender, er ikke avklart.
    tau: 0.5     # sekunder, glatting av farten fra GPS
    heave_tau: 20.0   # sekunder, middelhøyden heave regnes fra
