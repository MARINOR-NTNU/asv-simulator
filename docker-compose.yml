# Starter simulatoren og control sin PX4 sammen, i hver sin container:
#   docker compose up
# Valg settes som miljøvariabler, f.eks.:
#   HEADLESS=true docker compose up
#   SENSOR_NOISE=true WIND_SPEED=5 THRUST_TIME_CONSTANT=0.3 docker compose up   # mer realistisk
#   PX4_SRC=~/Flightcontroller-px4 docker compose up   # PX4 fra en egen kopi i stedet for submodulen
# Begge bruker host-nettverk, så PX4 finner agenten i vrx på 127.0.0.1:8888.
# For Gazebo-vindu må xhost +local:docker kjøres på verten først.

services:
  vrx:
    image: vrx-sim:humble-garden
    build: .
    network_mode: host
    devices:
      - /dev/dri
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/root/vrx_ws/src/mysrc
    # Pakkene våre bygges ved hver oppstart, fordi containeren startes på nytt hver gang.
    command:
      - bash
      - -c
      - >-
        cd /root/vrx_ws &&
        MAKEFLAGS=-j1 colcon build --merge-install --executor sequential --parallel-workers 1
        --packages-select asv_hydrodynamics asv_gazebo sim_interface &&
        source install/setup.bash &&
        ros2 launch sim_interface sim.launch.py control:=px4
        sim:=${SIM:-vrx_asv} world:=${WORLD:-open_water} scenario:=${SCENARIO:-none} headless:=${HEADLESS:-false}
        forward_thruster:=${FORWARD_THRUSTER:-bow}
        sensor_noise:=${SENSOR_NOISE:-false} wind_speed:=${WIND_SPEED:-0} wind_direction:=${WIND_DIRECTION:-0}
        wind_gust:=${WIND_GUST:-0} thrust_time_constant:=${THRUST_TIME_CONSTANT:-0.0}
        current_speed:=${CURRENT_SPEED:-0} current_direction:=${CURRENT_DIRECTION:-0}
        wave_height:=${WAVE_HEIGHT:-0.11} wave_period:=${WAVE_PERIOD:-5} wave_direction:=${WAVE_DIRECTION:-0.0}

  px4:
    image: px4-sitl:proteus
    build:
      context: .
      dockerfile: Dockerfile.px4
    network_mode: host
    # Som brukeren på verten, så byggefilene ikke eies av root. Har brukeren en annen id enn 1000:
    # UID=$(id -u) GID=$(id -g) docker compose up
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/tmp/home
    # Hele repoet, fordi submodulens .git peker til ../../.git/modules/. PX4_SRC legges oppå
    # submodulens plass, så control kan bygge og teste fra sin egen kopi (egen gren, ucommittede
    # endringer) uten å endre submodulen. Uten PX4_SRC monteres submodulen på seg selv.
    volumes:
      - .:/repo
      - ${PX4_SRC:-./px4/Flightcontroller-px4}:/repo/px4/Flightcontroller-px4
    working_dir: /repo/px4/Flightcontroller-px4
    # PX4-konsollen (pxh>) nås med docker attach. Ctrl-P Ctrl-Q går ut uten å stoppe PX4.
    stdin_open: true
    tty: true
    # MAVLink-biblioteket hentes før make: CMakeLists.txt i sitl_proteus kopierer custom.xml inn i
    # mappa før PX4 henter biblioteket, og da feiler hentingen på en ny kopi.
    # PX4_AIRFRAME: 10016 = none_iris, som får sensordata og klokke fra px4_hil_bridge i vrx (TCP 4560).
    # 10040 = sihsim_quadx, der PX4 simulerer et quadkopter selv.
    command:
      - bash
      - -c
      - >-
        mkdir -p $$HOME &&
        if [ ! -f Makefile ]; then
        echo "FEIL: PX4-koden mangler i px4/Flightcontroller-px4 (eller i PX4_SRC).";
        echo "Kjør fra roten av repoet: git submodule update --init px4/Flightcontroller-px4";
        echo "Med PX4_SRC: sjekk at stien peker til mappa med PX4-koden (der Makefile ligger).";
        exit 1; fi &&
        git submodule update --init src/modules/mavlink/mavlink &&
        make ${PX4_TARGET:-px4_sitl_proteus} j=1 &&
        cd build/${PX4_TARGET:-px4_sitl_proteus}/rootfs &&
        PX4_SYS_AUTOSTART=${PX4_AIRFRAME:-10016} ../bin/px4
